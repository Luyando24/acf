<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="znfu-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#0e3813"/>
    </linearGradient>
    <linearGradient id="znfu-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffca28"/>
      <stop offset="100%" stop-color="#f57f17"/>
    </linearGradient>
  </defs>

  <!-- Background circle with double border -->
  <circle cx="80" cy="80" r="76" fill="#ffffff" stroke="url(#znfu-green)" stroke-width="4"/>
  <circle cx="80" cy="80" r="70" fill="none" stroke="url(#znfu-gold)" stroke-width="2"/>

  <!-- Green Header Arch with typography -->
  <path d="M26 80 A54 54 0 0 1 134 80" fill="none" stroke="#e8f5e9" stroke-width="22" stroke-linecap="round"/>
  
  <!-- Tractor / Farming Silhouette -->
  <!-- Tractor cabin -->
  <rect x="58" y="52" width="22" height="18" rx="2" fill="#1b5e20"/>
  <rect x="62" y="55" width="14" height="11" rx="1" fill="#e8f5e9"/>
  <!-- Tractor hood -->
  <path d="M80 58 L102 58 L104 70 L80 70 Z" fill="#1b5e20"/>
  <!-- Exhaust pipe -->
  <rect x="96" y="50" width="3" height="8" fill="#f57f17"/>
  <!-- Big rear wheel -->
  <circle cx="68" cy="74" r="14" fill="#263238" stroke="#ffffff" stroke-width="2"/>
  <circle cx="68" cy="74" r="7" fill="url(#znfu-gold)"/>
  <!-- Front small wheel -->
  <circle cx="98" cy="76" r="9" fill="#263238" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="98" cy="76" r="4.5" fill="url(#znfu-gold)"/>

  <!-- Wheat grain laurels -->
  <path d="M40 85 Q36 60 52 48" stroke="#f57f17" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M120 85 Q124 60 108 48" stroke="#f57f17" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- ZNFU Banner -->
  <rect x="24" y="96" width="112" height="28" rx="6" fill="url(#znfu-green)"/>
  <text x="80" y="117" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" font-weight="900" fill="url(#znfu-gold)" text-anchor="middle" letter-spacing="3">ZNFU</text>

  <!-- Subtitle -->
  <text x="80" y="136" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="800" fill="#1b5e20" text-anchor="middle" letter-spacing="0.5">ZAMBIA NATIONAL FARMERS UNION</text>
</svg>
