<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="iapri-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="iapri-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
  </defs>

  <!-- Clean rounded shield card -->
  <rect x="6" y="6" width="148" height="148" rx="28" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>

  <!-- Geometric Policy/Analytics icon: Rising chart + Leaf + Open book -->
  <g transform="translate(80, 52)">
    <!-- Data chart bars in blue & green -->
    <rect x="-32" y="6" width="10" height="16" rx="2" fill="#90caf9"/>
    <rect x="-18" y="-4" width="10" height="26" rx="2" fill="#42a5f5"/>
    <rect x="-4" y="-16" width="10" height="38" rx="2" fill="url(#iapri-blue)"/>
    <rect x="10" y="-26" width="10" height="48" rx="2" fill="url(#iapri-green)"/>
    
    <!-- Stylized Agricultural Sprout over chart -->
    <path d="M15 -28 C26 -38 36 -32 36 -24 C36 -14 22 -20 15 -14 Z" fill="#66bb6a"/>
    <path d="M15 -28 C12 -38 2 -32 2 -24 C2 -14 12 -20 15 -14 Z" fill="#43a047"/>
    <line x1="-36" y1="23" x2="36" y2="23" stroke="#263238" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- IAPRI Bold Brand Typography -->
  <text x="80" y="106" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="900" fill="#0d47a1" text-anchor="middle" letter-spacing="3.5">IAPRI</text>

  <!-- Full institute name in two clear lines -->
  <text x="80" y="122" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="700" fill="#2e7d32" text-anchor="middle" letter-spacing="0.5">INDABA AGRICULTURAL POLICY</text>
  <text x="80" y="133" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="700" fill="#546e7a" text-anchor="middle" letter-spacing="0.5">RESEARCH INSTITUTE</text>
</svg>
