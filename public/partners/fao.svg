<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- Clean circular badge -->
  <circle cx="80" cy="80" r="76" fill="#ffffff" stroke="#0072bc" stroke-width="3"/>
  <circle cx="80" cy="80" r="70" fill="none" stroke="#e1f5fe" stroke-width="2"/>

  <!-- Wheat grain & globe motif for FAO -->
  <g transform="translate(80, 56)">
    <circle cx="0" cy="0" r="26" fill="#e1f5fe"/>
    <ellipse cx="0" cy="0" rx="26" ry="10" fill="none" stroke="#0072bc" stroke-width="1.5"/>
    <line x1="0" y1="-26" x2="0" y2="26" stroke="#0072bc" stroke-width="1.5"/>
    <!-- Stylized Wheat stalk in center -->
    <path d="M0 22 L0 -24" stroke="#e67e22" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0 -18 C6 -24 14 -20 12 -12 C6 -14 2 -16 0 -18 Z" fill="#e67e22"/>
    <path d="M0 -18 C-6 -24 -14 -20 -12 -12 C-6 -14 -2 -16 0 -18 Z" fill="#e67e22"/>
    <path d="M0 -6 C8 -12 16 -8 14 0 C7 -2 2 -4 0 -6 Z" fill="#e67e22"/>
    <path d="M0 -6 C-8 -12 -16 -8 -14 0 C-7 -2 -2 -4 0 -6 Z" fill="#e67e22"/>
    <path d="M0 6 C8 0 16 4 14 12 C7 10 2 8 0 6 Z" fill="#e67e22"/>
    <path d="M0 6 C-8 0 -16 4 -14 12 C-7 10 -2 8 0 6 Z" fill="#e67e22"/>
  </g>

  <!-- Typography -->
  <text x="80" y="106" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="900" fill="#0072bc" text-anchor="middle" letter-spacing="3.5">FAO</text>
  <text x="80" y="122" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="700" fill="#37474f" text-anchor="middle" letter-spacing="0.5">FOOD AND AGRICULTURE</text>
  <text x="80" y="132" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="700" fill="#0072bc" text-anchor="middle" letter-spacing="0.5">ORGANIZATION</text>
</svg>
