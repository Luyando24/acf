<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="ilc-earth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="50%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#f9a825"/>
    </linearGradient>
  </defs>

  <!-- Clean circular badge -->
  <circle cx="80" cy="80" r="76" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>

  <!-- Dynamic interlocking Land/Globe Ribbon Curves -->
  <g transform="translate(80, 52)">
    <!-- Globe outline -->
    <circle cx="0" cy="0" r="30" fill="#f1f8e9" stroke="#81c784" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="30" ry="12" fill="none" stroke="#a5d6a7" stroke-width="1.5" stroke-dasharray="3 2"/>
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#a5d6a7" stroke-width="1.5"/>

    <!-- Interlocking Land arcs -->
    <path d="M-24 10 C-10 -15 15 -18 26 2 C18 12 -4 14 -24 10 Z" fill="#2e7d32" opacity="0.9"/>
    <path d="M-15 18 C-2 2 18 4 24 16 C12 24 -2 24 -15 18 Z" fill="#f9a825" opacity="0.95"/>
    <circle cx="2" cy="-8" r="4.5" fill="#e65100"/>
  </g>

  <!-- Brand Typography -->
  <text x="80" y="106" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="25" font-weight="900" fill="#1b5e20" text-anchor="middle" letter-spacing="4">ILC</text>

  <!-- Full Name -->
  <text x="80" y="122" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="800" fill="#33691e" text-anchor="middle" letter-spacing="0.5">INTERNATIONAL LAND</text>
  <text x="80" y="133" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="800" fill="#558b2f" text-anchor="middle" letter-spacing="0.5">COALITION</text>
</svg>
